name: CI Test & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm install
    - name: Verify Database Initialization and Health
      run: |
        node -e "const { getPortfolio } = require('./database/db'); const p = getPortfolio(); console.log('Portfolio verified with', p.skills.length, 'skills.');"
    - name: Verify DOCX and Spreadsheet Generators
      run: |
        node -e "const { generatePortfolioWorkbookBuffer } = require('./services/googleSheetsService'); const { getPortfolio } = require('./database/db'); const buf = generatePortfolioWorkbookBuffer(getPortfolio()); console.log('Spreadsheet generated, size:', buf.length, 'bytes');"
